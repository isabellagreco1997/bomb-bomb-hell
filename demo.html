<!doctype html><html><head><meta charset="utf-8"><title>bomberman phase 1 demo</title>
<style>html,body{margin:0;background:#0d0206;height:100%;display:flex;align-items:center;justify-content:center}canvas{image-rendering:pixelated;image-rendering:crisp-edges}</style></head>
<body>
<div id="title" style="position:fixed;inset:0;background:#0d0206;display:flex;align-items:center;justify-content:center;overflow:hidden">
  <div id="titlebox" style="position:relative;aspect-ratio:736/400;width:min(100vw,calc(100vh*736/400))">
    <video id="titlevid" src="assets/video/title.mp4" autoplay muted loop playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated"></video>
    <canvas id="titlefx" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
    <!-- the PLAY button sits inside the empty gold frame the video draws at the bottom right -->
    <button id="play" style="position:absolute;left:48.5%;top:75.5%;width:45.4%;height:23.5%;background:transparent;border:0;cursor:pointer;font:bold min(6vh,5vw) monospace;letter-spacing:6px;color:#f3d9a0;text-shadow:0 0 12px rgba(255,120,60,0.9),0 0 2px #000" onmouseover="this.style.color='#fff2c8'" onmouseout="this.style.color='#f3d9a0'">PLAY</button>
  </div>
</div>
<canvas id="c" hidden></canvas>
<div id="flash" style="position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30;transition:opacity .35s ease-out"></div>
<script>
const T=48, COLS=13, ROWS=11, WC=21, WR=13, SCALE=Math.max(1,Math.floor(Math.min(innerWidth/(COLS*T),innerHeight/(ROWS*T+40))));   // COLS x ROWS = the view; WC x WR = the world
const HUD=40; const cv=document.getElementById('c'); cv.width=COLS*T; cv.height=ROWS*T+HUD; cv.style.width=cv.width*SCALE+'px'; cv.style.height=cv.height*SCALE+'px';
const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
const off=document.createElement('canvas'); off.width=128; off.height=128; const octx=off.getContext('2d'); octx.imageSmoothingEnabled=false;
const V=Date.now(); const atlas=new Image(); atlas.src='assets/atlas.png?v='+V;
let meta=null; fetch('assets/atlas.json?v='+V).then(r=>r.json()).then(m=>meta=m);
// voice lines: one random clip per bomb drop, never the same one twice in a row
let dropClips=[], multiClips=[]; let lastClip=-1, lastMulti=-1;
const loadClips=(url,into)=>fetch(url).then(r=>r.json()).then(list=>{ into.push(...list.map(p=>{const a=new Audio(p); a.preload='auto'; return a;})); });
let killClips=[]; let lastKill=-1; loadClips('assets/audio/drop.json',dropClips); loadClips('assets/audio/multi.json',multiClips); loadClips('assets/audio/kill.json',killClips); let startClips=[]; loadClips('assets/audio/start.json',startClips); let started=false; let hurtClips=[]; let lastHurt=-1; loadClips('assets/audio/hurt.json',hurtClips); let enemyHurtClips=[], deathClips=[]; let lastEH=-1; loadClips('assets/audio/enemyhurt.json',enemyHurtClips); loadClips('assets/audio/death.json',deathClips);
const intro=new Audio('assets/audio/intro.mp3'); intro.preload='auto'; intro.volume=0.9;
const music=new Audio('assets/audio/music.mp3'); music.preload='auto'; music.loop=true; music.volume=0.45;
let ready=false;   // true between the first key press and the end of the intro jingle: 'READY?' on screen, no movement
const sfx={}; for(const n of ['explode','tick','step']){ sfx[n]=new Audio(`assets/audio/${n}.mp3`); sfx[n].preload='auto'; }
function play(n,vol){ const a=sfx[n].cloneNode(); a.volume=vol; a.play().catch(()=>{}); }
let currentVoice=null;
// one voice at a time: a new line cuts off whatever she was saying (effects like tick/blast/steps are separate and untouched)
function pickPlay(clips,last){ if(!clips.length) return last; let i; do{ i=Math.floor(Math.random()*clips.length); }while(i===last&&clips.length>1);
  if(currentVoice){ currentVoice.pause(); currentVoice.currentTime=0; }
  const a=clips[i].cloneNode(); a.volume=0.8; currentVoice=a; a.play().catch(()=>{}); return i; }
// first bomb on the grid: a drop line; another bomb while one is already ticking: a multi-bomb line
function sfxDrop(chained){ if(chained) lastMulti=pickPlay(multiClips,lastMulti); else lastClip=pickPlay(dropClips,lastClip); }
// grid: 1 = pillar (every other cell, classic bomberman), 0 = floor
const solid=(cx,cy)=>cx<=0||cy<=0||cx>=WC-1||cy>=WR-1||(cx%2==0&&cy%2==0);
const cam={x:0,y:0};
let crates=[];   // crates[y][x]: 0 none, 1/2 crate type, negative = breaking (frames left, encoded as -n)
function genCrates(){ crates=[]; for(let y=0;y<WR;y++){ crates.push([]); for(let x=0;x<WC;x++){ let v=0; if(!solid(x,y) && (Math.abs(x-1)+Math.abs(y-1))>3 && Math.random()<0.38) v=1+Math.floor(Math.random()*2); crates[y].push(v);} } }
genCrates();
const crateAt=(x,y)=>crates[y]&&crates[y][x]>0;
let worldT=0; const embers=[];   // ambient: lava pulse, statue eye flares, wall braziers, drifting embers
const hash=(x,y)=>((x*73856093)^(y*19349663))>>>0;
const hero={x:1,y:1,px:1*T,py:1*T,dir:'down',moving:false,t:0,speed:2.4};
const candles=[]; const ENEMIES=2;
function spawnEnemies(){ candles.length=0; const dirs=['left','right','up','down']; let tries=0;
  while(candles.length<ENEMIES && tries++<500){ const x=1+Math.floor(Math.random()*(WC-2)), y=1+Math.floor(Math.random()*(WR-2));
    if(solid(x,y) || crateAt(x,y) || (Math.abs(x-1)+Math.abs(y-1))<8 || candles.some(c=>c.x===x&&c.y===y)) continue;
    candles.push({x,y,px:x*T,py:y*T,dir:dirs[Math.floor(Math.random()*4)],t:Math.floor(Math.random()*100),speed:1.0,hp:2,state:'alive',st:0,flash:0}); } }
spawnEnemies();
const bombs=[]; const fires=[]; let hurtT=0; let lives=3; let deadT=0; let gameOver=false; let winT=0; let cleared=false; const RANGE=2;
const keys={};
window.addEventListener('error',e=>{ const b=document.createElement('div'); b.style.cssText='position:fixed;left:8px;bottom:8px;z-index:9;background:#400;color:#fdd;font:12px monospace;padding:6px 10px;max-width:90vw'; b.textContent='error: '+e.message+' @'+e.lineno; document.body.appendChild(b); }); let readyAt=0;
// title overlay: vignette + floating embers, drawn on a canvas over the looping video
(function(){ const c=document.getElementById('titlefx'), x=c.getContext('2d'); const ps=[]; let last=performance.now();
  function frame(now){ if(document.getElementById('title').hidden) return; const dt=Math.min(50,now-last); last=now;
    const W=c.width=c.clientWidth, H=c.height=c.clientHeight; x.clearRect(0,0,W,H);
    if(ps.length<70 && Math.random()<0.6) ps.push({x:Math.random()*W, y:H+10, vy:-(0.25+Math.random()*0.5)*(H/400), vx:(Math.random()-0.5)*0.3, s:0.6+Math.random()*0.9, life:2500+Math.random()*3000, t:0, ph:Math.random()*6.3});
    for(let i=ps.length-1;i>=0;i--){ const p=ps[i]; p.t+=dt; p.x+=p.vx+Math.sin(p.t/400+p.ph)*0.3; p.y+=p.vy*(dt/16.7); if(p.t>p.life||p.y<-10){ps.splice(i,1);continue;}
      const a=Math.sin(Math.PI*Math.min(1,p.t/p.life)); const k=W/736, r=p.s*k;
      const gl=x.createRadialGradient(p.x,p.y,0,p.x,p.y,r*6); gl.addColorStop(0,`rgba(255,180,80,${(0.55*a).toFixed(2)})`); gl.addColorStop(0.4,`rgba(255,90,30,${(0.22*a).toFixed(2)})`); gl.addColorStop(1,'rgba(255,60,20,0)');
      x.fillStyle=gl; x.beginPath(); x.arc(p.x,p.y,r*6,0,6.3); x.fill();                                   // soft glow
      x.fillStyle=`rgba(255,${210+Math.floor(a*45)},150,${(0.5+0.5*a).toFixed(2)})`; x.beginPath(); x.arc(p.x,p.y,r,0,6.3); x.fill(); }   // tiny hot core
    const vg=x.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.72); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.82)'); x.fillStyle=vg; x.fillRect(0,0,W,H);
    requestAnimationFrame(frame); }
  requestAnimationFrame(frame); })();
document.addEventListener('click',()=>{ window._clicks=(window._clicks||0)+1; }, true);
let playing=false;
function showGame(){ const t=document.getElementById('title'); t.hidden=true; t.style.display='none'; cv.hidden=false; if(!started){ started=true; beginRound(); } }
document.getElementById('play').addEventListener('click',()=>{ if(playing) return; playing=true;
  const v=document.getElementById('titlevid'), btn=document.getElementById('play'); btn.style.display='none';
  // her 'pressing play' video runs once with its own sound (the click is the gesture browsers need), then a quick flash and the game
  v.loop=false; v.muted=false; v.src='assets/video/press.mp4'; v.currentTime=0;
  let done=false; const go=()=>{ if(done) return; done=true; const f=document.getElementById('flash'); f.style.transition='none'; f.style.opacity='1'; showGame(); requestAnimationFrame(()=>requestAnimationFrame(()=>{ f.style.transition='opacity .35s ease-out'; f.style.opacity='0'; })); };
  v.onended=go; v.onerror=go; v.play().catch(go); setTimeout(go,8000); });
function endReady(){ if(!ready) return; ready=false; music.play().catch(()=>{}); }
function beginRound(){ ready=true; readyAt=performance.now(); music.pause(); music.currentTime=0; intro.currentTime=0; intro.onended=endReady; intro.play().catch(()=>{}); setTimeout(endReady,5200); pickPlay(startClips,-1); }
addEventListener('keydown',e=>{ if(!started){ return; } if(gameOver||cleared){ resetGame(); beginRound(); e.preventDefault(); return; } keys[e.key]=1; if(e.key==='e'||e.key==='E') dropBomb(); e.preventDefault()}); addEventListener('keyup',e=>keys[e.key]=0);   /* first key = game start + a random start line (browsers need a gesture before sound) */
const params=new URLSearchParams(location.search); let auto=params.get('auto'); let autoT=0;
function drawBomb(b){
  const FUSE=150, tk=meta.anims.bomb_tick, f=meta.frames[tk[Math.min(tk.length-1,Math.floor(b.t/FUSE*tk.length))]];
  const left=FUSE-b.t;
  // pulse like the original: the sphere swells and shrinks, faster as the fuse runs out
  const period=left>60?24:(left>30?12:6); const s=1-(Math.floor(b.t/(period/2))%2)*0.12;   // current size is the maximum; it pulses down from it
  const w=Math.round(f[2]*s), h=Math.round(f[3]*s);
  const x=Math.round(b.x*T+T/2-w/2), y=Math.round(b.y*T+T-h);   // anchored at the bottom: the base stays on the floor while it pulses
  const flash=left<=36 && Math.floor(left/4)%2===0;      // red flashes in the last 0.6 s
  if(!flash){ ctx.drawImage(atlas,f[0],f[1],f[2],f[3],x,y,w,h); return; }
  octx.clearRect(0,0,128,128); octx.globalCompositeOperation='source-over'; octx.drawImage(atlas,f[0],f[1],f[2],f[3],0,0,f[2],f[3]);
  octx.globalCompositeOperation='source-atop'; octx.fillStyle='rgba(255,40,40,0.55)'; octx.fillRect(0,0,f[2],f[3]);
  ctx.drawImage(off,0,0,f[2],f[3],x,y,w,h);
}
function hit(src){
  lives--; hurtT=90;
  if(lives<=0){ deadT=1; hurtT=0; music.pause(); pickPlay(deathClips,-1); const g=new Audio('assets/audio/gameover.mp3'); g.volume=0.8; g.play().catch(()=>{}); return; }   // game over sound starts with the dying animation
  if(src==='fire') lastHurt=pickPlay(hurtClips,lastHurt); else lastEH=pickPlay(enemyHurtClips,lastEH);
}
function resetGame(){ genCrates(); lives=3; deadT=0; gameOver=false; winT=0; cleared=false; hurtT=0; bombs.length=0; fires.length=0; hero.x=1;hero.y=1;hero.px=T;hero.py=T;hero.dir='down';hero.moving=false; spawnEnemies(); }
function dropBomb(){ if(deadT>0||gameOver||ready||winT>0) return; if(bombs.some(b=>b.x===hero.x&&b.y===hero.y)) return; const chained=bombs.length>0; bombs.push({x:hero.x,y:hero.y,t:0,owner:true}); sfxDrop(chained); }
function explode(b){
  const cells=[[b.x,b.y,'c']];
  for(const [dx,dy,k] of [[1,0,'h'],[-1,0,'h'],[0,1,'v'],[0,-1,'v']]){
    for(let r=1;r<=RANGE;r++){ const cx=b.x+dx*r, cy=b.y+dy*r; if(solid(cx,cy)) break; cells.push([cx,cy,k]); if(crateAt(cx,cy)){ crates[cy][cx]=-(crates[cy][cx]*100+30); break; }
      const other=bombs.find(o=>o.x===cx&&o.y===cy&&!o.dead); if(other){other.t=999;} }
  }
  fires.push({cells,t:0}); play('explode',0.9);
}
function inFire(x,y){ return fires.some(f=>f.cells.some(c=>c[0]===x&&c[1]===y)); }
function drawFrame(name,x,y){const f=meta.frames[name]; ctx.drawImage(atlas,f[0],f[1],f[2],f[3],Math.round(x)-((f[2]-T)>>1),Math.round(y)-(f[3]-T),f[2],f[3]);}   // bottom on the tile, centred horizontally
function update(){
  // bombs tick (2.5 s), then burst into a cross of fire that lasts 0.7 s
  for(const b of bombs){ b.t++; const left=150-b.t, period=left>60?24:(left>30?12:6), beat=Math.floor(b.t/(period/2));
    if(beat!==b.beat){ b.beat=beat; if(beat%2===1) play('tick',0.5); }
    if(b.t>=150&&!b.dead){ b.dead=true; explode(b);} }
  for(let i=bombs.length-1;i>=0;i--) if(bombs[i].dead) bombs.splice(i,1);
  for(const f of fires) f.t++;
  worldT++;
  // embers: spawn over floor tiles in view, drift up and fade
  if(embers.length<40 && Math.random()<0.5){ const x=cam.x+Math.random()*COLS*T, y=cam.y+Math.random()*ROWS*T; const tx=Math.floor(x/T), ty=Math.floor(y/T); if(!solid(tx,ty)) embers.push({x,y,vy:-(0.15+Math.random()*0.25),vx:(Math.random()-0.5)*0.15,life:90+Math.random()*60,t:0}); }
  for(let i=embers.length-1;i>=0;i--){ const e=embers[i]; e.t++; e.x+=e.vx; e.y+=e.vy; if(e.t>e.life) embers.splice(i,1); }
  for(let y=0;y<WR;y++)for(let x=0;x<WC;x++){ const v=crates[y][x]; if(v<0){ const type=Math.floor(-v/100), left=(-v)%100-1; crates[y][x]= left<=0?0:-(type*100+left); } }
  for(let i=fires.length-1;i>=0;i--) if(fires[i].t>42) fires.splice(i,1);
  if(hurtT>0) hurtT--;
  if(deadT===0 && hurtT===0 && inFire(hero.x,hero.y)) { hit('fire'); }
  // touching a live enemy hurts too (overlap of more than 40% of a tile, in pixels, so brushing past a corner is safe)
  if(deadT===0 && hurtT===0 && candles.some(c=>c.state==='alive' && Math.abs(hero.px-c.px)<T*0.6 && Math.abs(hero.py-c.py)<T*0.6)) { hit('enemy'); }
  if(deadT>0){ deadT++; if(deadT>24*7+60){ gameOver=true; } }
  if(winT===0 && deadT===0 && !ready && candles.length && candles.every(c=>c.state==='dead')){ winT=1; music.pause(); if(currentVoice){currentVoice.pause();} const w=new Audio('assets/audio/win.mp3'); w.volume=0.9; currentVoice=w; w.play().catch(()=>{}); const j=new Audio('assets/audio/winlevel.mp3'); j.volume=0.7; j.play().catch(()=>{}); }   // laughter + the level-clear jingle together   // her own laughter from the win video
  if(winT>0){ winT++; if(winT>360+30) cleared=true; }
  for(const c of candles){
    if(c.state==='alive'){ if(c.flash>0) c.flash--;
      if(c.flash===0 && inFire(c.x,c.y)){ c.hp--; if(c.hp<=0){ c.state='dying'; c.st=0; lastKill=pickPlay(killClips,lastKill); } else { c.flash=50; } } }
    else if(c.state==='dying'){ c.st++; if(c.st>60) c.state='dead'; }
  }
  // hero movement on the grid (Bomberman: tile-locked, smooth between tiles)
  const atTile=Math.abs(hero.px-hero.x*T)<0.01&&Math.abs(hero.py-hero.y*T)<0.01;
  if(atTile && deadT===0 && !gameOver && !ready && winT===0){
    let want=null;
    if(auto){autoT++; const seq=['right','down','right','down','left','up']; want=seq[Math.floor(autoT/60)%6]; if(autoT%160===20) dropBomb();}
    else if(keys.ArrowLeft)want='left';else if(keys.ArrowRight)want='right';else if(keys.ArrowUp)want='up';else if(keys.ArrowDown)want='down';
    if(want){hero.dir=want; const d={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]}[want]; const bx=hero.x+d[0], by=hero.y+d[1]; if(!solid(bx,by) && !crateAt(bx,by) && !bombs.some(b=>b.x===bx&&b.y===by)){hero.x+=d[0];hero.y+=d[1];hero.moving=true; play('step',0.35);}else hero.moving=false}
    else hero.moving=false;
  }
  const tx=hero.x*T,ty=hero.y*T; hero.px+=Math.sign(tx-hero.px)*Math.min(hero.speed,Math.abs(tx-hero.px)); hero.py+=Math.sign(ty-hero.py)*Math.min(hero.speed,Math.abs(ty-hero.py));
  hero.t++;
  // enemies: grid-locked wander; at each tile keep going, or turn when blocked (or at random, 1 in 6)
  const DIRS={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};
  for(const c of candles){ c.t++; if(c.state!=='alive') continue;
    const at=Math.abs(c.px-c.x*T)<0.01&&Math.abs(c.py-c.y*T)<0.01;
    if(at){ let [dx,dy]=DIRS[c.dir]; const blocked=(x,y)=>solid(x,y)||crateAt(x,y)||bombs.some(b=>b.x===x&&b.y===y);
      if(blocked(c.x+dx,c.y+dy)||Math.random()<1/6){ const opts=Object.keys(DIRS).filter(k=>!blocked(c.x+DIRS[k][0],c.y+DIRS[k][1])); if(opts.length) c.dir=opts[Math.floor(Math.random()*opts.length)]; [dx,dy]=DIRS[c.dir]; }
      if(!blocked(c.x+dx,c.y+dy)){ c.x+=dx; c.y+=dy; } }
    c.px+=Math.sign(c.x*T-c.px)*Math.min(c.speed,Math.abs(c.x*T-c.px)); c.py+=Math.sign(c.y*T-c.py)*Math.min(c.speed,Math.abs(c.y*T-c.py)); }
  // camera: centred on her, clamped to the world
  cam.x=Math.max(0,Math.min(WC*T-COLS*T, hero.px+T/2-COLS*T/2)); cam.y=Math.max(0,Math.min(WR*T-ROWS*T, hero.py+T/2-ROWS*T/2));
}
function draw(){
  ctx.setTransform(1,0,0,1,-Math.round(cam.x),HUD-Math.round(cam.y));
  const cx0=Math.floor(cam.x/T), cy0=Math.floor(cam.y/T);
  for(let cy=cy0;cy<Math.min(WR,cy0+ROWS+1);cy++)for(let cx=cx0;cx<Math.min(WC,cx0+COLS+1);cx++){
    const border=cx<=0||cy<=0||cx>=WC-1||cy>=WR-1; let name;
    let sconce=null; if(border){ name='tile_wall'; const corner=(cx<=0||cx>=WC-1)&&(cy<=0||cy>=WR-1); if(!corner && hash(cx,cy)%4===0) sconce=['tile_brazier','tile_brazier_1','tile_brazier_2'][Math.floor((worldT+hash(cx,cy))/7)%3]; }   // wall first, a flickering candelabra layered on every 4th one
    else if(solid(cx,cy)){ name=((worldT+hash(cx,cy))%300<14)?'tile_pillar_glow':'tile_pillar'; }                                                             // the statue's eyes flare for a quarter second every 5 s, out of phase
    else { const ph=Math.floor((worldT/24+hash(cx,cy)%6)%6); name=['tile_floor','tile_floor_1','tile_floor_1','tile_floor','tile_floor_2','tile_floor_2'][ph]; }   // lava veins pulse dim / bright, per tile out of phase
    const f=meta.frames[name]; ctx.drawImage(atlas,f[0],f[1],f[2],f[3],cx*T,cy*T,T,T);
    if(sconce){ const s=meta.frames[sconce]; ctx.drawImage(atlas,s[0],s[1],s[2],s[3],cx*T,cy*T,T,T); }
    const v=crates[cy][cx]; if(v!==0){ const type=v>0?v:Math.floor(-v/100); const g=meta.frames[`tile_crate_${type-1}${v<0?'_broken':''}`]; ctx.drawImage(atlas,g[0],g[1],g[2],g[3],cx*T,cy*T,T,T); } }
  for(const e of embers){ const a=1-e.t/e.life; ctx.fillStyle=`rgba(255,${120+Math.floor(a*100)},40,${(0.35+0.5*a).toFixed(2)})`; ctx.fillRect(Math.round(e.x),Math.round(e.y),2,2); }
  for(const b of bombs) drawBomb(b);
  for(const f of fires){ const ph=Math.floor(f.t/6)%3;
    for(const [cx,cy,k] of f.cells){ drawFrame(meta.anims['fire_'+k][ph],cx*T,cy*T); } }
  for(const c of candles){ if(c.state==='dead') continue; const bob=Math.round(Math.sin(c.t/11)*3);
    if(c.state==='alive'){ if(c.flash>0 && Math.floor(c.flash/5)%2===0){ const an=meta.anims.candle_hurt; drawFrame(an[Math.floor(c.flash/10)%an.length],c.px,c.py+bob); } else drawFrame(meta.anims.candle_flicker[Math.floor(c.t/5)%10],c.px,c.py+bob); }
    else { const an=c.st<24?meta.anims.candle_hurt:meta.anims.candle_defeated; drawFrame(an[Math.floor(c.st/8)%an.length],c.px,c.py); } }
  const an=hero.moving?meta.anims['heroine_walk_'+hero.dir]:meta.anims['heroine_idle_'+hero.dir];
  if(ready){ const an=meta.anims.heroine_start; const k=Math.min(an.length-1,Math.floor((performance.now()-readyAt)/1000*7)); drawFrame(an[k],hero.px,hero.py); }   // start poses at 7 fps, hold the last one
  else if(winT>0){ const an=meta.anims.heroine_win; drawFrame(an[Math.min(an.length-1,Math.floor(winT/(360/an.length)))],hero.px,hero.py); }   // 32 poses spread over the 6 s of the laugh, exactly the video's own timing
  else if(deadT>0){ const an=meta.anims.heroine_death; drawFrame(an[Math.min(an.length-1,Math.floor(deadT/7))],hero.px,hero.py); }   // death sequence at ~8.5 fps, hold the collapsed pose
  else if(hurtT===0 || Math.floor(hurtT/4)%2===0) drawFrame(an[Math.floor(hero.t/(hero.moving?4:6))%an.length],hero.px,hero.py);
  // HUD: Bomberman-style top bar, hearts at the left
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#1a0a0e'; ctx.fillRect(0,0,cv.width,HUD); ctx.fillStyle='#c9a24a'; ctx.fillRect(0,HUD-3,cv.width,2); ctx.fillRect(0,0,cv.width,1);
  for(let i=0;i<3;i++){ const f=meta.frames[i<lives?'hud_heart_full':'hud_heart_empty']; ctx.drawImage(atlas,f[0],f[1],f[2],f[3],12+i*28,8,f[2],f[3]); }
  if(ready){ ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(0,HUD,cv.width,cv.height-HUD); ctx.fillStyle='#f3d9a0'; ctx.font='bold 22px monospace'; ctx.textAlign='center'; ctx.fillText('READY?', cv.width/2, cv.height/2); }
  if(cleared){ ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,HUD,cv.width,cv.height-HUD); ctx.fillStyle='#f3d9a0'; ctx.font='bold 18px monospace'; ctx.textAlign='center'; ctx.fillText('PHASE 1 CLEAR', cv.width/2, cv.height/2); ctx.font='bold 12px monospace'; ctx.fillText('press any key', cv.width/2, cv.height/2+22); }
  if(gameOver){ ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,HUD,cv.width,cv.height-HUD); ctx.fillStyle='#f3d9a0'; ctx.font='bold 18px monospace'; ctx.textAlign='center'; ctx.fillText('GAME OVER', cv.width/2, cv.height/2); ctx.font='bold 12px monospace'; ctx.fillText('press any key', cv.width/2, cv.height/2+22); }
}
// fixed timestep: logic always runs at 60 Hz (catching up to 4 steps if the display frame is late), one draw per display frame
const STEP=1000/60; let acc=0, last=performance.now();
function step(now){
  if(auto && !started){ started=true; ready=false; const t=document.getElementById('title'); t.hidden=true; t.style.display='none'; cv.hidden=false; }
  if(!meta||!atlas.complete){ last=now||performance.now(); requestAnimationFrame(step); return; }
  now=now||performance.now(); acc+=Math.min(100,now-last); last=now;
  let n=0; while(acc>=STEP && n<4){ update(); acc-=STEP; n++; }
  if(acc>=STEP) acc=0;
  draw();
  requestAnimationFrame(step);
}
// --- perf telemetry: every 3 s send fps + step cost + scale to the local server log (GET, shows as a 404 line) ---
let _fr=0,_stepMs=0,_t0=performance.now(); const _step=step;
function fpsReport(){ const dt=(performance.now()-_t0)/1000; const fps=(_fr/dt).toFixed(1), ms=(_stepMs/Math.max(1,_fr)).toFixed(2);
  fetch(`/stat?fps=${fps}&stepms=${ms}&scale=${SCALE}&dpr=${devicePixelRatio}&win=${innerWidth}x${innerHeight}&bombs=${bombs.length}&fires=${fires.length}&title=${document.getElementById('title').hidden?0:1}&started=${started?1:0}&ready=${ready?1:0}&clicks=${window._clicks||0}`).catch(()=>{}); _fr=0;_stepMs=0;_t0=performance.now(); }
setInterval(fpsReport,3000);
step=function(now){ const a=performance.now(); _step(now); _stepMs+=performance.now()-a; _fr++; };
requestAnimationFrame(step);
</script></body></html>
